version: "0.1.6"
wcag_version: "2.1"

contrast:
  AA:
    text: 4.5
    nontext: 3.0
  AAA:
    text: 7.0
    nontext: 3.0

# Recommended font sizes (in pt). NOT WCAG-mandated. WCAG specifies
# resizability (1.4.4) and large-text contrast thresholds (>=18pt or
# >=14pt bold for success criterion 1.4.3), not absolute minimum sizes. The values
# below are package defaults applied by theme_a11y() and a11y_layout().
font_size:
  AA:
    body: 12
    title: 12
    legend: 12
  AAA:
    body: 14
    title: 14
    legend: 14

# Palettes resolve from source packages at runtime, so the listed hex codes
# are the authoritative source palette (RColorBrewer or viridisLite) -- no
# hex copies maintained here.
#
# safe_on: white | dark | both | labeled
#   "labeled" = palette only safe when each fill carries a high-contrast text label
# purpose: line | fill | both
# source:  literal | rcolorbrewer | viridislite
palettes:
  dark2_8:
    source:   rcolorbrewer
    palette:  Dark2
    n_colors: 8
    safe_on:  labeled
    purpose:  fill
    notes:    "RColorBrewer Dark2. Two of eight fail AA on white -- pair with cell labels."
  set2_8:
    source:   rcolorbrewer
    palette:  Set2
    n_colors: 8
    safe_on:  labeled
    purpose:  fill
    notes:    "RColorBrewer Set2. Pastel categorical for labeled fills."
  paired_12:
    source:   rcolorbrewer
    palette:  Paired
    n_colors: 12
    safe_on:  labeled
    purpose:  fill
    notes:    "RColorBrewer Paired (light/dark pairs). Twelve categories."
  aaa_5:
    source:   literal
    colors:   ["#154E8A","#7C2C5E","#5C5108","#8A3A1F","#2D5C53"]
    safe_on:  white
    purpose:  both
    notes:    "Custom AAA-on-white categorical (deep blue / purple / olive / terracotta / teal). All five > 7.5:1 on white. Distinguishability under color-vision differences not formally validated -- pair with shape or linetype for redundant encoding (WCAG 1.4.1)."

# diverging gradients (low / mid / high)
# Brewer endpoint positions:
#   default [10, 6, 2] = saturated, AA on white only
#   "_dual" [9, 6, 3]  = mid-saturation, non-text 3:1 on both white and dark
diverging:
  rdbu:
    source:    rcolorbrewer
    palette:   RdBu
    positions: [10, 6, 2]
    safe_on:   white
    purpose:   gradient
    notes:     "RColorBrewer RdBu. Endpoints AA on white."
  puor:
    source:    rcolorbrewer
    palette:   PuOr
    positions: [10, 6, 2]
    safe_on:   white
    purpose:   gradient
    notes:     "RColorBrewer PuOr. Endpoints AA on white. Use when red has unwanted connotation."
  brbg:
    source:    rcolorbrewer
    palette:   BrBG
    positions: [10, 6, 2]
    safe_on:   white
    purpose:   gradient
    notes:     "RColorBrewer BrBG. Brown-blue-green; endpoints AA on white."
  rdbu_dual:
    source:    rcolorbrewer
    palette:   RdBu
    positions: [9, 6, 3]
    safe_on:   both
    purpose:   gradient
    notes:     "RColorBrewer RdBu mid-saturation. Endpoints clear non-text 3:1 on white and #1a1a1a dark."
  puor_dual:
    source:    rcolorbrewer
    palette:   PuOr
    positions: [9, 6, 3]
    safe_on:   both
    purpose:   gradient
    notes:     "RColorBrewer PuOr mid-saturation. Endpoints clear non-text 3:1 on white and #1a1a1a dark."
  brbg_dual:
    source:    rcolorbrewer
    palette:   BrBG
    positions: [9, 6, 3]
    safe_on:   both
    purpose:   gradient
    notes:     "RColorBrewer BrBG mid-saturation. Endpoints clear non-text 3:1 on white and #1a1a1a dark."
  coolwarm_aaa:
    source:    literal
    low:       "#3b4cc0"
    mid:       "#ffffff"
    high:      "#b40426"
    safe_on:   white
    purpose:   gradient
    notes:     "Custom diverging. Both endpoints AAA on white (>7:1). Fails on dark; pick *_dual for both backgrounds."

# sequential continuous gradients (viridisLite options)
sequential:
  cividis:
    source:  viridislite
    option:  cividis
    safe_on: both
    purpose: gradient
    notes:   "viridisLite cividis. Readable in greyscale; spans the full lightness range."
  viridis:
    source:  viridislite
    option:  viridis
    safe_on: both
    purpose: gradient
    notes:   "viridisLite viridis (Smith & van der Walt). Perceptually uniform default."
  plasma:
    source:  viridislite
    option:  plasma
    safe_on: both
    purpose: gradient
    notes:   "viridisLite plasma. Higher dynamic range; emphasizes extremes."

# Alpha presets for chart layers. Select one when setting transparency.
overlay_presets:
  raw_points:    0.4
  overlay_point: 0.6
  labels:        0.7
  fill:          0.9
  ci_ribbon:     0.10
  ci_band:       0.15
  draw_order: "arrange(desc(size_var)) before geom_point -- larger drawn first, smaller on top"

tooltip:
  bg: "rgba(33,37,41,0.95)"
  text: "#f8f9fa"
  border: "#6c757d"
  font: "Roboto, sans-serif"
  size: 14

sc_mapping:
  theme_a11y:
    - "1.4.3 Contrast (Minimum)"
    - "1.4.11 Non-text Contrast"
    - "1.4.12 Text Spacing"
  scale_a11y_color:
    - "1.4.1 Use of Color"
  a11y_alt_text:
    - "1.1.1 Non-text Content"
  a11y_layout:
    - "1.4.3 Contrast (Minimum)"
    - "1.4.4 Resize text"
    - "1.4.11 Non-text Contrast"
