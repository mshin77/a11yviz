- title: "Audits and checks"
  desc:  "Multi-criterion figure audit, rubric, and single-aspect checks"
  contents:
  - a11y_audit
  - a11y_audit_chart
  - a11y_audit_doc
  - a11y_audit_actionable
  - a11y_audit_summary
  - a11y_rubric
  - a11y_check_alt_text
  - a11y_check_headings
