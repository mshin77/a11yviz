url: https://mshin77.github.io/a11yviz/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary:   "#0072B2"
    secondary: "#56B4E9"

development:
  mode: auto

navbar:
  structure:
    left:  [intro, playground, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Vignette
      menu:
        - text: R
          href: articles/a11yviz.html
        - text: Python
          href: articles/py-a11yviz.html
    playground:
      text: Playground
      menu:
        - text: R
          href: articles/r-walkthrough.html
        - text: Python
          href: articles/py-walkthrough.html
    reference:
      text: Reference
      menu:
        - text: R
          href: articles/r-reference.html
        - text: Python
          href: articles/py-reference.html

reference:
- title: "ggplot2 transforms"
  desc:  "Composable additions to a ggplot chain"
  contents:
  - theme_a11y
  - scale_color_a11y
  - scale_fill_a11y
  - scale_color_a11y_div
  - scale_fill_a11y_div
  - scale_color_a11y_seq
  - scale_fill_a11y_seq

- title: "plotly transforms"
  desc:  "Layout and styling for plotly figures"
  contents:
  - a11y_layout
  - a11y_ggplotly

- title: "Alt text"
  desc:  "Attach, scaffold, or LLM-draft screen-reader descriptions"
  contents:
  - a11y_alt_text
  - a11y_alt_template
  - a11y_describe

- title: "Palettes"
  desc:  "Discrete, diverging, and sequential palettes with WCAG metadata"
